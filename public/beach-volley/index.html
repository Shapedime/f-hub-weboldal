<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beach Volley</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d1a24; overflow: hidden; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #0d1a24; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #f4f1e8; font: 600 16px Georgia, serif; }
    #bar { width: min(320px, 70vw); height: 8px; border-radius: 99px; background: rgba(255,255,255,.15); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #efb945; transition: width .2s; }
    #error { color: #ff9b8a; max-width: 80vw; text-align: center; display: none; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <div>Beach Volley betöltése…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script>
    // A browser may refuse pointer lock (iframe focus, ESC pressed, embedded webviews).
    // Swallow that rejection so Unity doesn't treat it as a fatal error.
    const requestLock = Element.prototype.requestPointerLock;
    Element.prototype.requestPointerLock = function (...args) {
      try {
        const result = requestLock.apply(this, args);
        if (result && typeof result.catch === 'function') result.catch(() => {});
        return result;
      } catch (e) { return undefined; }
    };
  </script>
  <script src="Build/WebGL.loader.js"></script>
  <script>
    const loading = document.getElementById('loading');
    const fill = document.getElementById('fill');
    const error = document.getElementById('error');
    const canvas = document.getElementById('unity-canvas');

    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: 'Build/WebGL.data.unityweb',
      frameworkUrl: 'Build/WebGL.framework.js.unityweb',
      codeUrl: 'Build/WebGL.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Shapedime',
      productName: 'Beach Volley',
      productVersion: '0.1.0',
      showBanner: (msg, type) => { if (type === 'error') { error.style.display = 'block'; error.textContent = msg; } },
    }, (p) => { fill.style.width = (p * 100) + '%'; })
      .then(() => { loading.remove(); canvas.focus(); })
      .catch((msg) => { error.style.display = 'block'; error.textContent = 'Nem sikerült betölteni: ' + msg; });

    canvas.addEventListener('pointerdown', () => canvas.focus());
  </script>
</body>
</html>
